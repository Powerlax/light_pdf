[package]
name = "light_pdf"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Embed the pdfium library into the binary for self-contained distribution
# This increases binary size significantly (~30MB) but produces a single-file executable
embed-pdfium = []

[dependencies]
eframe = "0.33.3"
image = "0.25"
# pdfium-render 0.8.37 requires pdfium binaries version 7543
# See build.sh for automatic pdfium download
pdfium-render = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
rfd = "0.11"

[dev-dependencies]
tempfile = "3.6"
